<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Apercu de deux post-it sur le bureau">
  <defs>
    <linearGradient id="desktop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f8fc"/>
      <stop offset="1" stop-color="#dde5ef"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#26374a" flood-opacity="0.20"/>
    </filter>
    <filter id="shadowSmall" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#26374a" flood-opacity="0.17"/>
    </filter>
    <style>
      .title { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 15px; fill: #696458; }
      .body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 18px; fill: #2b2b2b; }
      .heading { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 20px; fill: #2b2b2b; }
      .caption { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 15px; fill: #64748b; }
    </style>
  </defs>

  <rect width="900" height="520" fill="url(#desktop)"/>

  <!-- Note jaune -->
  <g filter="url(#shadow)">
    <rect x="88" y="62" width="364" height="304" rx="14" fill="#fff3a3"/>
    <path d="M88 76 Q88 62 102 62 H438 Q452 62 452 76 V112 H88 Z" fill="#f6e894"/>
    <rect x="88" y="111" width="364" height="1.4" fill="#e7d780"/>

    <circle cx="116" cy="88" r="6" fill="#585246"/>
    <text x="134" y="94" class="title">Post-it</text>

    <circle cx="390" cy="88" r="7" fill="#585246"/>
    <path d="M424 81 L436 93 M436 81 L424 93" stroke="#585246" stroke-width="1.6" stroke-linecap="round"/>

    <text x="110" y="154" class="heading">À faire cette semaine</text>
    <text x="110" y="192" class="body">• Appeler le dentiste</text>
    <text x="110" y="222" class="body">• Réserver le train</text>
    <text x="110" y="252" class="body">• Finir le rapport</text>
    <text x="110" y="282" class="body">• Arroser les plantes</text>
    <text x="110" y="326" class="body">Idée : week-end à la mer</text>

    <rect x="428" y="120" width="12" height="238" rx="6" fill="#eee4ab"/>
    <rect x="428" y="120" width="12" height="74" rx="6" fill="#d9cd8e"/>
  </g>

  <!-- Note bleue -->
  <g filter="url(#shadowSmall)">
    <rect x="516" y="196" width="310" height="252" rx="14" fill="#cde7ff"/>
    <path d="M516 210 Q516 196 530 196 H812 Q826 196 826 210 V242 H516 Z" fill="#c1dcf5"/>
    <rect x="516" y="241" width="310" height="1.4" fill="#b3cfe9"/>

    <circle cx="542" cy="218" r="6" fill="#4d5a66"/>
    <text x="560" y="224" class="title">Post-it</text>

    <circle cx="772" cy="218" r="7" fill="#4d5a66"/>
    <path d="M798 211 L810 223 M810 211 L798 223" stroke="#4d5a66" stroke-width="1.6" stroke-linecap="round"/>

    <text x="538" y="280" class="heading">Idées</text>
    <text x="538" y="316" class="body">• Un blog</text>
    <text x="538" y="346" class="body">• Une appli de recettes</text>
    <text x="538" y="376" class="body">• Lire plus</text>

    <rect x="804" y="250" width="12" height="186" rx="6" fill="#bcd8f0"/>
    <rect x="804" y="250" width="12" height="58" rx="6" fill="#9fc0dc"/>
  </g>

  <text x="88" y="432" class="caption">Rust + Win32 · un seul processus · aucune dépendance graphique lourde</text>
</svg>
